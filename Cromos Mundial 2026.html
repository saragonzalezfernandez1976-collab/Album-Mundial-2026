<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control Álbum Mundial 2026</title>
<style>
:root { --bg:#f5f5f5; --card:#fff; --text:#111; --muted:#666; --line:#ddd; --ok:#111; }
* { box-sizing:border-box; }
body { margin:0; font-family:Arial, Helvetica, sans-serif; background:var(--bg); color:var(--text); }
header { position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--line); padding:14px 18px; }
h1 { margin:0; font-size:24px; }
.sub { color:var(--muted); margin-top:4px; font-size:14px; }
.controls { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
input, button, select { padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; font-size:14px; }
input { flex:1; min-width:220px; }
button { cursor:pointer; }
button:hover { background:#eee; }
.stats { display:flex; gap:12px; flex-wrap:wrap; padding:14px 18px; }
.stat { background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 14px; min-width:140px; }
.stat strong { display:block; font-size:22px; }
main { padding:0 18px 24px; }
.team { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px; }
.team-head { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.flag { font-size:22px; width:30px; text-align:center; }
.team-title { font-weight:700; min-width:160px; }
.team-count { margin-left:auto; color:var(--muted); font-size:13px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(58px, 1fr)); gap:7px; }
.sticker { border:1px solid #cfcfcf; border-radius:8px; padding:8px 4px; text-align:center; background:#fafafa; user-select:none; cursor:pointer; font-weight:700; font-size:12px; }
.sticker.got { background:#111; color:#fff; border-color:#111; text-decoration:line-through; }
footer { color:#777; text-align:center; padding:20px; font-size:12px; }
@media print {
  header .controls, footer { display:none; }
  body { background:#fff; }
  .team { break-inside:avoid; }
}
</style>
</head>
<body>
<header>
  <h1>PLANILLA DE CONTROL</h1>
  <div class="sub">Mundial 2026 · FIFA World Cup 2026</div>
  <div class="controls">
    <input id="search" placeholder="Buscar selección o cromo, por ejemplo ESP7">
    <select id="filter">
      <option value="all">Todos</option>
      <option value="missing">Solo faltantes</option>
      <option value="got">Solo conseguidos</option>
    </select>
    <button onclick="exportData()">Exportar progreso</button>
    <button onclick="document.getElementById('importFile').click()">Importar</button>
    <button onclick="resetData()">Reiniciar</button>
    <input id="importFile" type="file" accept=".json" style="display:none">
  </div>
</header>

<section class="stats">
  <div class="stat"><span>Total</span><strong id="total">0</strong></div>
  <div class="stat"><span>Conseguidos</span><strong id="got">0</strong></div>
  <div class="stat"><span>Faltantes</span><strong id="missing">0</strong></div>
  <div class="stat"><span>Progreso</span><strong id="progress">0%</strong></div>
</section>

<main id="app"></main>
<footer>App local: los datos se guardan en este navegador.</footer>

const KEY = "panini_mundial_2026_progreso_v1";
let owned = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));

function save() {
  localStorage.setItem(KEY, JSON.stringify([...owned]));
}

function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const filter = document.getElementById("filter").value;
  const app = document.getElementById("app");
  app.innerHTML = "";
  let total=0, got=0;

  DATA.forEach(team => {
    const stickers = team.stickers.filter(s => {
      const isGot = owned.has(s);
      const textMatch = !q || team.name.toLowerCase().includes(q) || team.code.toLowerCase().includes(q) || s.toLowerCase().includes(q);
      const filterMatch = filter === "all" || (filter === "got" && isGot) || (filter === "missing" && !isGot);
      return textMatch && filterMatch;
    });
    total += team.stickers.length;
    got += team.stickers.filter(s => owned.has(s)).length;
    if (!stickers.length) return;

    const teamGot = team.stickers.filter(s => owned.has(s)).length;
    const section = document.createElement("section");
    section.className = "team";
    section.innerHTML = `
      <div class="team-head">
        <div class="flag">${team.flag}</div>
        <div class="team-title">${team.code} · ${team.name}</div>
        <div class="team-count">${teamGot}/${team.stickers.length}</div>
      </div>
      <div class="grid">
        ${stickers.map(s => `<div class="sticker ${owned.has(s) ? "got" : ""}" data-code="${s}">${s}</div>`).join("")}
      </div>`;
    app.appendChild(section);
  });

  document.querySelectorAll(".sticker").forEach(el => {
    el.addEventListener("click", () => {
      const code = el.dataset.code;
      if (owned.has(code)) owned.delete(code); else owned.add(code);
      save(); render();
    });
  });

  document.getElementById("total").textContent = total;
  document.getElementById("got").textContent = got;
  document.getElementById("missing").textContent = total - got;
  document.getElementById("progress").textContent = Math.round((got/total)*100) + "%";
}

function exportData() {
  const blob = new Blob([JSON.stringify([...owned], null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "progreso_panini_2026.json";
  a.click();
}

function resetData() {
  if (confirm("¿Seguro que quieres borrar el progreso guardado?")) {
    owned = new Set(); save(); render();
  }
}

document.getElementById("importFile").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    owned = new Set(JSON.parse(reader.result));
    save(); render();
  };
  reader.readAsText(file);
});

document.getElementById("search").addEventListener("input", render);
document.getElementById("filter").addEventListener("change", render);
render();
</script>
</body>
</html>
